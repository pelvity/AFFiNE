version: '3'

services:
  # AFFiNE Server (Local Working Version)
  affine:
    image: affine_server:working-version
    container_name: affine_server_working
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - AFFINE_CONFIG_PATH=/root/.affine/config
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgres://affine:affine@postgres:5432/affine
      - AFFINE_ADMIN_EMAIL=admin@affine.pro
      - AFFINE_ADMIN_PASSWORD=admin
      - AFFINE_SERVER_PORT=3010
      - AFFINE_SERVER_HOST=0.0.0.0
    volumes:
      - affine-config:/root/.affine/config
      - affine-storage:/root/.affine/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - affine_net

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: affine_postgres_working
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=affine
      - POSTGRES_PASSWORD=affine
      - POSTGRES_DB=affine
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affine"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affine_net

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: affine_redis_working
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affine_net

networks:
  affine_net:
    driver: bridge

volumes:
  affine-config:
  affine-storage:
  postgres-data:
  redis-data:
