apiVersion: v1
kind: Service
metadata:
  name: affine
  namespace: affine
  labels:
    app: affine
spec:
  type: NodePort
  ports:
    - port: 3010
      targetPort: 3010
      nodePort: 30010
      name: http
  selector:
    app: affine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
  namespace: affine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: affine
  template:
    metadata:
      labels:
        app: affine
    spec:
      initContainers:
        - name: migration
          image: pelvity/affine-backend:prod
          command: ['sh', '-c', 'corepack enable && yarn workspace @affine/server prisma migrate deploy']
          env:
            - name: DATABASE_URL
              value: "postgresql://affine:SecureProductionPassword123@postgres:5432/affine"
            - name: REDIS_SERVER_HOST
              value: "redis"
      containers:
        - name: affine
          image: pelvity/affine-backend:prod
          ports:
            - containerPort: 3010
          env:
            - name: NODE_ENV
              value: "production"
            - name: AFFINE_ENV
              value: "production"
            - name: DATABASE_URL
              value: "postgresql://affine:SecureProductionPassword123@postgres:5432/affine"
            - name: REDIS_SERVER_HOST
              value: "redis"
            - name: PORT
              value: "3010"
            - name: HOST
              value: "0.0.0.0"
            - name: AFFINE_SERVER_EXTERNAL_URL
              value: "http://localhost:3010" # CHANGEME: Update to your domain/IP
            # Optional Gemini Bridge
            - name: AFFINE_COPILOT_ENABLED
              value: "true"
            - name: AFFINE_COPILOT_PROVIDERS_GEMINIWEBAPI_ENABLED
              value: "false" # Disabled by default to make it optional as requested
            # - name: AFFINE_COPILOT_PROVIDERS_GEMINIWEBAPI_BASE_URL
            #   value: "http://gemini-bridge:8765"
          volumeMounts:
            - name: affine-config
              mountPath: /root/.affine/config
            - name: affine-storage
              mountPath: /root/.affine/storage
      volumes:
        - name: affine-config
          emptyDir: {} # Use PVC for persistence in real prod
        - name: affine-storage
          emptyDir: {} # Use PVC for persistence in real prod
