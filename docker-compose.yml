version: '3'

services:
  # AFFiNE Backend (Custom Build)
  affine:
    image: affine-server-custom
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: affine_server
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=production
      - AFFINE_INDEXER_ENABLED=false
      - REDIS_SERVER_HOST=redis
      - DB_USERNAME=affine
      - DB_PASSWORD=pelvity
      - DB_DATABASE=affine
      - DATABASE_URL=postgresql://affine:pelvity@postgres:5432/affine
      - PORT=3010
      - HOST=0.0.0.0
      - AFFINE_SERVER_HTTPS=false
      # Enable Copilot/AI features
      - AFFINE_COPILOT_ENABLED=true
      # Configure Gemini WebAPI provider
      - AFFINE_COPILOT_PROVIDERS_GEMINIWEBAPI_BASE_URL=http://gemini-bridge:8765
      - AFFINE_COPILOT_PROVIDERS_GEMINIWEBAPI_ENABLED=true
      # Server configuration
      - AFFINE_SERVER_EXTERNAL_URL=http://localhost:3010
      - AFFINE_AUTH_ENABLED=false
    volumes:
      - C:\Users\admin\.affine\self-host\config:/root/.affine/config
      - C:\Users\admin\.affine\self-host\storage:/root/.affine/storage
      - ./affine-config.json:/root/.affine/config/config.json
    depends_on:
      - redis
      - postgres
      - gemini-bridge
    networks:
      - affine_net

  # Gemini WebAPI Bridge
  gemini-bridge:
    build:
      context: ../wind_env_setup/ai-guides-hub/projects/affine-personal-addon
      dockerfile: Dockerfile
    container_name: gemini_bridge
    shm_size: '2gb'
    ports:
      - "8765:8765"
    environment:
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=8765
      - COOKIE_REFRESH_INTERVAL=3600
      - GEMINI_COOKIE_1PSID=g.a0003wjbp87QrpI0GDp_9zGz-0vOj79f2sw3iA1TJ3N8FVbnfHP0t_D2G6DuTor3csNZBJt41wACgYKAd0SARESFQHGX2Mi5FKLftEvqEhJOi9IxBYwFBoVAUF8yKrEvJKpl7cGTJKB88lqmETn0076
      - GEMINI_COOKIE_1PSIDTS=sidts-CjcBwQ9iI3ieHH1jiomUuZlhJl_LW4KRTC5r0v_QJ847KFqNz3eY_YzHKLr-YaeKu4AKcJFHyJXNEAA
    volumes:
      - ../wind_env_setup/ai-guides-hub/projects/affine-personal-addon/.gemini_cookies.json:/app/.gemini_cookies.json
      - ../wind_env_setup/ai-guides-hub/projects/affine-personal-addon/.browser_profile:/app/.browser_profile
    networks:
      - affine_net

  # Dependencies
  redis:
    image: redis
    container_name: affine_redis
    ports:
      - "6379:6379"
    networks:
      - affine_net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: affine_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=affine
      - POSTGRES_PASSWORD=pelvity
      - POSTGRES_DB=affine
    volumes:
      - C:\Users\admin\.affine\self-host\postgres\pgdata:/var/lib/postgresql/data
    networks:
      - affine_net

networks:
  affine_net:
    driver: bridge
