services:
  affine:
    image: ghcr.io/pelvity/affine:dev
    container_name: affine_server_dev
    restart: unless-stopped
    ports:
      - "3011:3010"
    environment:
      - NODE_ENV=production
      - AFFINE_CONFIG_PATH=/root/.affine/config
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgres://affine:affine@postgres:5432/affine
      - AFFINE_ADMIN_EMAIL=admin@affine.pro
      - AFFINE_ADMIN_PASSWORD=admin
      - AFFINE_SERVER_PORT=3010
      - AFFINE_SERVER_HOST=0.0.0.0
      - AFFINE_SERVER_EXTERNAL_URL=http://localhost:3011
    volumes:
      - affine-dev-config:/root/.affine/config
      - affine-dev-storage:/root/.affine/storage
      - /tmp/mobile-assets-manifest.json:/app/packages/backend/server/static/mobile/assets-manifest.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - affine_dev_net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: affine_postgres_dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=affine
      - POSTGRES_PASSWORD=affine
      - POSTGRES_DB=affine
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affine"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affine_dev_net

  redis:
    image: redis:7-alpine
    container_name: affine_redis_dev
    restart: unless-stopped
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affine_dev_net

networks:
  affine_dev_net:
    driver: bridge

volumes:
  affine-dev-config:
  affine-dev-storage:
  postgres-dev-data:
  redis-dev-data:
